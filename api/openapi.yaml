    AdminActionRequest:
      oneOf:
      - $ref: '#/components/schemas/AdminUsernameAction'
      - $ref: '#/components/schemas/AdminSimpleAction'
      - $ref: '#/components/schemas/AdminRevokeKeyAction'
      - $ref: '#/components/schemas/AdminRoleAction'
      discriminator:
        propertyName: action
        mapping:
          username: '#/components/schemas/AdminUsernameAction'
          suspend: '#/components/schemas/AdminSimpleAction'
          restore: '#/components/schemas/AdminSimpleAction'
          revoke_sessions: '#/components/schemas/AdminSimpleAction'
          password_reset: '#/components/schemas/AdminSimpleAction'
          revoke_key: '#/components/schemas/AdminRevokeKeyAction'
          role: '#/components/schemas/AdminRoleAction'
    AdminActionVersion:
      type: integer
      minimum: 1
    AdminActionReason:
      type: string
      minLength: 3
      maxLength: 500
      description: 3–500 Unicode code points, with at least 3 after trimming surrounding whitespace.
    AdminActionRole:
      type: string
      enum:
      - user
      - admin
    AdminUsernameAction:
      type: object
      additionalProperties: false
      properties:
        action:
          type: string
          enum:
          - username
        expected_version:
          $ref: '#/components/schemas/AdminActionVersion'
        reason:
          $ref: '#/components/schemas/AdminActionReason'
        username:
          type: string
          minLength: 3
          maxLength: 30
      required:
      - action
      - expected_version
      - reason
      - username
    AdminSimpleAction:
      type: object
      additionalProperties: false
      properties:
        action:
          type: string
          enum:
          - suspend
          - restore
          - revoke_sessions
          - password_reset
        expected_version:
          $ref: '#/components/schemas/AdminActionVersion'
        reason:
          $ref: '#/components/schemas/AdminActionReason'
      required:
      - action
      - expected_version
      - reason
    AdminRevokeKeyAction:
      type: object
      additionalProperties: false
      properties:
        action:
          type: string
          enum:
          - revoke_key
        expected_version:
          $ref: '#/components/schemas/AdminActionVersion'
        reason:
          $ref: '#/components/schemas/AdminActionReason'
        key_id:
          type: string
          format: uuid
      required:
      - action
      - expected_version
      - reason
      - key_id
    AdminRoleAction:
      type: object
      additionalProperties: false
      properties:
        action:
          type: string
          enum:
          - role
        expected_version:
          $ref: '#/components/schemas/AdminActionVersion'
        reason:
          $ref: '#/components/schemas/AdminActionReason'
        role:
          $ref: '#/components/schemas/AdminActionRole'
        proof:
          type: string
          format: uuid
          writeOnly: true
      required:
      - action
      - expected_version
      - reason
      - role
      - proof
    AdminRoleIntent:
      type: object
      additionalProperties: false
      properties:
        action:
          type: string
          enum:
          - role
        expected_version:
          $ref: '#/components/schemas/AdminActionVersion'
        reason:
          $ref: '#/components/schemas/AdminActionReason'
        role:
          $ref: '#/components/schemas/AdminActionRole'
      required:
      - action
      - expected_version
      - reason
      - role
    AdminActionResult:
      type: object
      properties:
        status:
          type: string
          enum:
          - applied
          - request_accepted
        user:
          $ref: '#/components/schemas/AdminUser'
      required:
      - status
      - user
    AdminReauthRequest:
      type: object
      additionalProperties: false
      properties:
        password:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 1024
        intent:
          $ref: '#/components/schemas/AdminRoleIntent'
      required:
      - password
      - intent
    AdminReauthResult:
      type: object
      properties:
        proof:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
      required:
      - proof
      - expires_at
